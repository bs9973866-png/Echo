name: Echo Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Распаковать Echo в репозиторий
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode echo-source.zip.b64 > /tmp/echo-source.zip
          mkdir -p /tmp/echo-source
          unzip -q /tmp/echo-source.zip -d /tmp/echo-source
          cp -a /tmp/echo-source/echo/. .
          rm -f echo-source.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Echo source project"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установить зависимости и создать Android-проект
        working-directory: mobile
        run: |
          npm install
          npm run android

      - name: Собрать APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Проверить APK
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: echo-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
